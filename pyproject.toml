[project]
name = "covercheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.29.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
covercheck = "covercheck:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
